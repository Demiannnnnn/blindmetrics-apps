[workspace]
resolver = "2"
members = [
    "telemetry-crypto-core",
    "worker-client/ipc",
    "worker-client/service",
    "worker-client/src-tauri",
    "admin-client/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Telemetry Team <security@telemetry.local>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal shared cryptographic and IPC crates
telemetry-crypto-core = { path = "telemetry-crypto-core" }
agent-ipc = { path = "worker-client/ipc" }

# Cryptography
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
subtle = "2.6"
# Key backup v2 (TASK-CRYPTO-03): Argon2id, only `hash_password_into` (no PHC strings).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
unicode-normalization = "0.1"

# Serialization and utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
dotenvy = "0.15"

# Argon2id with production parameters (64 MiB, t = 3) takes minutes unoptimized; tests and
# debug builds compile the KDF with optimizations (TASK-CRYPTO-03 §4.6).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
