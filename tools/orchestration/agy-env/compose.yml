# Two agy containers, one Google account each. WORKSPACE and AGY_UID come from .env (written by setup.sh).
name: agy-multi

x-agy: &agy
  build:
    context: .
    args:
      UID: ${AGY_UID:-1000}
  image: agy-multi:latest
  restart: unless-stopped
  init: true
  environment:
    - TERM=xterm-256color
    - COLORTERM=truecolor
    # git sees "dubious" owners on the shared mount; only the owner's repos live there
    - GIT_CONFIG_COUNT=1
    - GIT_CONFIG_KEY_0=safe.directory
    - GIT_CONFIG_VALUE_0=*
    # Linking the Tauri workspace or the API test binary with full debug info needs GBs; two agents
    # plus a validation in a 6 GiB VM got the linker OOM-killed. Fewer jobs + line tables only.
    - CARGO_BUILD_JOBS=${AGY_CARGO_JOBS:-2}
    - CARGO_PROFILE_DEV_DEBUG=line-tables-only
    - CARGO_PROFILE_TEST_DEBUG=line-tables-only

services:
  agy-pro:            # Google AI Pro account
    <<: *agy
    container_name: agy-pro
    hostname: agy-pro
    volumes:
      - pro-home:/home/agy
      - locks:/locks
      - ${WORKSPACE:?run setup.sh}:${WORKSPACE:?run setup.sh}

  agy-plus:           # Google AI Plus account
    <<: *agy
    container_name: agy-plus
    hostname: agy-plus
    volumes:
      - plus-home:/home/agy
      - locks:/locks
      - ${WORKSPACE:?run setup.sh}:${WORKSPACE:?run setup.sh}

  pg:                 # PostgreSQL 16 for telemetry-api agents: one database per worktree (pg.sh)
    image: postgres:16-alpine
    container_name: telemetry-pg
    hostname: pg
    ports:
      - "127.0.0.1:5441:5432"   # native (host) agy runs reach it as 127.0.0.1:5441
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
  locks:              # shared compile lock (flock)
  pro-home:
  plus-home:
