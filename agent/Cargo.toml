[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
telemetry-crypto-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.30"
notify-rust = "4"
dotenvy.workspace = true
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
keyring = { version = "3.0", features = ["apple-native", "windows-native", "sync-secret-service"] }
rdev = "0.5"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["link"] }

