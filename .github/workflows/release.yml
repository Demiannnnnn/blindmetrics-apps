name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  pre-check:
    name: Pre-release verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate TELEMETRY_API_URL gate (SEC-10)
        shell: bash
        run: |
          API_URL="${{ vars.TELEMETRY_API_URL || secrets.TELEMETRY_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::error::TELEMETRY_API_URL is required for release builds (set in vars.TELEMETRY_API_URL or secrets.TELEMETRY_API_URL)"
            exit 1
          fi
          if [[ ! "$API_URL" =~ ^https:// ]]; then
            echo "::error::TELEMETRY_API_URL must start with https:// in release builds (SEC-10)"
            exit 1
          fi
          echo "TELEMETRY_API_URL format verified (https://)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify telemetry-crypto-core tests
        run: cargo test -p telemetry-crypto-core

  build-installers:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    needs: [pre-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxtst-dev libx11-dev \
            libxcb1-dev libxrandr-dev libxkbcommon-dev libdbus-1-dev libegl1-mesa-dev \
            libwayland-dev libgbm-dev libdrm-dev libpipewire-0.3-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build admin-client release
        env:
          TELEMETRY_API_URL: ${{ vars.TELEMETRY_API_URL || secrets.TELEMETRY_API_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ADMIN_GOOGLE_CLIENT_ID: ${{ secrets.ADMIN_GOOGLE_CLIENT_ID || vars.ADMIN_GOOGLE_CLIENT_ID }}
          ADMIN_GOOGLE_CLIENT_SECRET: ${{ secrets.ADMIN_GOOGLE_CLIENT_SECRET || vars.ADMIN_GOOGLE_CLIENT_SECRET }}
        run: |
          cd admin-client
          npm ci
          npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Build worker-client release
        env:
          TELEMETRY_API_URL: ${{ vars.TELEMETRY_API_URL || secrets.TELEMETRY_API_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd worker-client
          npm ci
          npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Collect installer bundles: .dmg, .app.tar.gz, .deb, .AppImage, .msi, *-setup.exe
          find target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*-setup.exe" \) | while read -r file; do
            filename=$(basename "$file")
            # If an .app.tar.gz bundle lacks target triple in name, append it to avoid collision
            if [[ "$filename" == *".app.tar.gz" && "$filename" != *"${{ matrix.target }}"* ]]; then
              base="${filename%.app.tar.gz}"
              cp "$file" "dist-artifacts/${base}_${{ matrix.target }}.app.tar.gz"
            else
              cp "$file" "dist-artifacts/$filename"
            fi
          done
          echo "Staged artifacts for ${{ matrix.target }}:"
          ls -la dist-artifacts

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist-artifacts/*
          if-no-files-found: error

  release-draft:
    name: Create GitHub Release draft
    needs: [build-installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_step
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "develop-AGENTS" ]; then
            TAG="v0.1.0"
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd all-artifacts
          # Calculate sha256 checksums in deterministic C collation order
          LC_ALL=C sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.tag }}
          name: Release ${{ steps.tag_step.outputs.tag }}
          draft: true
          prerelease: false
          files: |
            all-artifacts/*
            all-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
